*{box-sizing:border-box;margin:0;padding:0}

/* ---------- 走廊 ---------- */

#corHud{position:absolute;top:16px;left:20px;z-index:5;pointer-events:none}

#dlgName{font-size:13px;font-weight:500;color:#7fe7ff}

#dlgIn{flex:1;background:rgba(255,255,255,.06);border:0.5px solid rgba(255,255,255,.25);border-radius:8px;color:#cfe6f2;padding:8px 10px;font-size:12.5px;outline:none;font-family:inherit}
#dlgSend{padding:7px 14px}

#end{position:absolute;inset:0;z-index:20;display:none;background:rgba(4,6,12,.96);align-items:center;justify-content:center}
#endBox{width:min(560px,90%);background:#0b1018;border:1px solid rgba(250,199,117,.5);border-radius:16px;padding:30px;text-align:center}
#endBox h2{font-size:20px;font-weight:500;color:#FAC775;margin-bottom:6px}
#endBox p{font-size:12px;color:#66788a;margin-bottom:16px}
#endGrid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:18px}
#endGrid .eg{padding:6px 12px;border:0.5px solid rgba(250,199,117,.4);border-radius:16px;font-size:11px;color:#FAC775}
.dust{position:absolute;border-radius:50%;background:rgba(130,205,255,.5);pointer-events:none}

/* ---------- 拍照模式 ---------- */
#photoF{position:absolute;inset:0;z-index:15;display:none;pointer-events:none}

#photoF .pmk{position:absolute;top:30px;left:34px;font-size:11px;letter-spacing:2px;color:rgba(255,255,255,.75)}

function loop(now){

  if(!paused&&!dlgOpen)dayPhase+=dayDir*dt/100;
  /* 移动 */
  var moving=false;
  if(!dlgOpen){
   var sp=5.5*dt*(riding?2.7:1);
   var fx=Math.sin(yaw),fz=Math.cos(yaw); /* 视线方向 */
   if(keys["w"]||keys["arrowup"]){P0.x+=fx*sp;P0.z+=fz*sp;moving=true}
   if(keys["s"]||keys["arrowdown"]){P0.x-=fx*sp;P0.z-=fz*sp;moving=true}
   if(keys["a"]){P0.x-=fz*sp*0.8;P0.z+=fx*sp*0.8;moving=true}
   if(keys["d"]){P0.x+=fz*sp*0.8;P0.z-=fx*sp*0.8;moving=true}
   if(keys["arrowleft"])yawT-=1.9*dt;
   if(keys["arrowright"])yawT+=1.9*dt;
   pitchT=clamp(pitchT,-0.42,0.42);
   pitch+=(pitchT-pitch)*0.12;
   yawT=Math.atan2(Math.sin(yawT),Math.cos(yawT));
   yaw+=Math.atan2(Math.sin(yawT-yaw),Math.cos(yawT-yaw))*0.12;
   if(inside){P0.x=clamp(P0.x,-2.6,2.6);P0.z=clamp(P0.z,10.4,15.4)}
   else{P0.x=clamp(P0.x,-11,11);P0.z=clamp(P0.z,2,52)}
  }
  horizon=H*0.55+pitch*H*0.7; /* 俯仰=整个地平线上下移动 */
  /* 行走镜头晃动 */
  if(moving&&!paused){bobP+=dt*(riding?11:8);bobY=Math.sin(bobP)*(riding?4.5:3)}
  else bobY*=0.85;
  drawScene(dt);
  /* 爱心粒子 */
  for(var i2=hearts.length-1;i2>=0;i2--){var hh2=hearts[i2];hh2.t+=dt;hh2.y-=dt*26;
   if(hh2.t>hh2.d){hearts.splice(i2,1);continue}
   ctx.save();ctx.globalAlpha=1-hh2.t/hh2.d;ctx.fillStyle="#E77FA0";ctx.font="14px sans-serif";ctx.textAlign="center";ctx.fillText("♥",hh2.x,hh2.y);ctx.restore()}
  $("scClock").textContent=L("画中时刻 ","In-painting time ")+fmtClock()+(paused?L("（已暂停）"," (paused)"):dayDir<0?L("（倒流中）"," (rewinding)"):"");
 }
 requestAnimationFrame(loop);
}
function drawScene(dt){
 if(inside){drawInterior();return}
 var dl=Math.max(0,Math.sin((dayPhase%1)*Math.PI*2));
 if(weather=="rain")dl*=0.62;else if(weather=="snow")dl*=0.85;else if(weather=="sand")dl*=0.72;
 /* 天空 */
 ctx.fillStyle=mix(era.sky[0],era.sky[1],dl);ctx.fillRect(0,0,W,H);
 ctx.save();ctx.globalAlpha=(1-dl)*0.9;ctx.fillStyle="#fff";
 for(var i=0;i<stars.length;i++){ctx.beginPath();ctx.arc(stars[i][0]*W,stars[i][1]*H,stars[i][2],0,7);ctx.fill()}
 ctx.restore();
 var df=dayPhase%1;
 if(df<0.5){var pr=df*2;ctx.fillStyle="#FAC775";ctx.beginPath();ctx.arc(W*(0.12+0.76*pr),horizon-50-Math.sin(pr*Math.PI)*(horizon-120),16,0,7);ctx.fill()}
 else{var q=(df-0.5)*2;ctx.save();ctx.globalAlpha=0.92;ctx.fillStyle="#D3D1C7";ctx.beginPath();ctx.arc(W*(0.12+0.76*q),horizon-50-Math.sin(q*Math.PI)*(horizon-120),12,0,7);ctx.fill();ctx.restore()}
 /* 云 */
 clouds.forEach(function(cl){cl.x+=cl.v*dt*3;if(cl.x>1.2)cl.x=-0.25;
  var cx=cl.x*W,cy=cl.y*H,cs=cl.s*(W*0.05);
  ctx.save();ctx.globalAlpha=0.16+0.3*dl;ctx.fillStyle=dl>0.35?"#FFFFFF":"#44506B";
  ctx.beginPath();ctx.ellipse(cx,cy,cs,cs*0.38,0,0,7);ctx.ellipse(cx+cs*0.7,cy+cs*0.1,cs*0.65,cs*0.3,0,0,7);ctx.ellipse(cx-cs*0.7,cy+cs*0.12,cs*0.6,cs*0.28,0,0,7);ctx.fill();ctx.restore()});
 /* 飞鸟 */
 ctx.strokeStyle="rgba(255,255,255,"+(0.25+dl*0.45)+")";ctx.lineWidth=1.4;
 birds.forEach(function(b){b.x+=b.v*dt*8;if(b.x>1.15)b.x=-0.15;
  var bx=b.x*W,by=b.y*H+Math.sin(tSec*2+b.x*9)*6;
  ctx.beginPath();ctx.moveTo(bx-5,by);ctx.quadraticCurveTo(bx,by-4,bx+0,by);ctx.quadraticCurveTo(bx+5,by-4,bx+5,by);ctx.stroke()});
 /* 地面 + 透视网格 */
 var gb=mix(era.gnd[0],era.gnd[1],dl);
 ctx.fillStyle=gb;ctx.fillRect(0,horizon,W,H-horizon);
 var gc=mix(mix(era.gnd[1],era.gnd[0],dl),"#000000",0.22);
 ctx.strokeStyle=gc;ctx.globalAlpha=0.5;ctx.lineWidth=1;
 for(var gx=-14;gx<=14;gx+=2){
  var f=project(gx,60),n2=project(gx,1.8);
  if(f&&n2){ctx.beginPath();ctx.moveTo(f.sx,f.sy);ctx.lineTo(n2.sx,n2.sy);ctx.stroke()}}
 for(var gz=2.4;gz<70;gz*=1.28){
  var r2=project(0,gz);if(r2){ctx.beginPath();ctx.moveTo(0,r2.sy);ctx.lineTo(W,r2.sy);ctx.stroke()}}
 ctx.globalAlpha=1;
 /* 地表细节：草叶/砂纹 */
 var gd=(era.key=="pre"||era.key=="tang")?1:0;
 ctx.strokeStyle=mix(mix(era.gnd[1],era.gnd[0],dl),"#000000",0.3);ctx.lineWidth=1;
 for(var gi=0;gi<46;gi++){
  var gxr=(rnd(gi*7+1)-0.5)*26,gzr=3.2+rnd(gi*11+3)*40;
  var gp=project(gxr,gzr);if(!gp)continue;
  ctx.save();ctx.globalAlpha=clamp(1.2-gzr/40,0.15,0.6);
  if(gd){var gh=(2+rnd(gi)*3)*gp.s;ctx.beginPath();ctx.moveTo(gp.sx,gp.sy);ctx.quadraticCurveTo(gp.sx+2*gp.s,gp.sy-gh,gp.sx+4*gp.s,gp.sy);ctx.stroke()}
  else{ctx.beginPath();ctx.moveTo(gp.sx-3*gp.s,gp.sy);ctx.lineTo(gp.sx+3*gp.s,gp.sy);ctx.stroke()}
  ctx.restore()}
 /* 远处地平线雾带 */
 ctx.save();ctx.globalAlpha=0.25;ctx.fillStyle=era.sky[1];ctx.fillRect(0,horizon-3,W,7);ctx.restore();
 /* 收集物 & NPC & 建筑统一按深度排序绘制 */
 var draws=[];
 era.props.forEach(function(p2){draws.push({z:p2[2],fn:function(){drawProp(p2,dl)}})});
 if(era.far)era.far.forEach(function(p2){draws.push({z:p2[2],fn:function(){drawProp(p2,dl)}})});
 var cCol=mix(era.fg,"#0B0B12",(1-dl)*0.8);
 var myItems=store.items[era.key]||[];
 nearItem=null;var bestIt=1e9;
 era.items.forEach(function(it,ii){
  if(myItems.indexOf(it.name)>=0)return;
  draws.push({z:it.z,fn:function(){
   var p3=project(it.x,it.z);if(!p3)return;
   var d2=Math.hypot(it.x-P0.x,it.z-P0.z);
   var gl=0.25+0.2*Math.sin(tSec*3+ii)+((d2<5)?0.35:0);
   ctx.save();ctx.globalAlpha=gl;ctx.fillStyle="#FAC775";ctx.beginPath();ctx.arc(p3.sx,p3.sy-6*p3.s,14*p3.s,0,7);ctx.fill();ctx.restore();
   ctx.save();ctx.translate(p3.sx,p3.sy-6*p3.s);var isc=p3.s*1.1;ICONS[it.icon](isc);ctx.restore();
   if(d2<5&&Math.abs(p3.sx-W/2)<W*0.4){label(p3.sx,p3.sy-18*p3.s,t2(it.name)+L(" · 按空格拾取"," · Space to pick up"),"#FAC775");
    if(d2<bestIt){bestIt=d2;nearItem=it}}
  }})});
 nearNpc=null;var bestNpc=1e9;lastNpcHit=null;
 era.npcs.forEach(function(n3,ni){
  var wx=n3.x+Math.sin(tSec*0.22+ni*2.1)*0.8;
  draws.push({z:n3.z,fn:function(){
   var p3=project(wx,n3.z);if(!p3)return;
   var bob=Math.sin(tSec*1.6+ni)*1.5*p3.s;
   var cc=mix(n3.robe||era.fg,"#0B0B12",(1-dl)*0.8);
   person(ctx,p3.sx,p3.sy+bob,p3.s,cc,"stand",tSec,{robe:cc,hat:n3.hat,hold:n3.hold,dl:dl,face:n3.face});
   var d2=Math.hypot(wx-P0.x,n3.z-P0.z);
   ctx.font="11px 'Segoe UI','Microsoft YaHei',sans-serif";ctx.textAlign="center";
   ctx.fillStyle="rgba(255,255,255,.75)";ctx.fillText(t2(n3.n),p3.sx,p3.sy-26*p3.s+bob);
   if(d2<8&&Math.abs(p3.sx-W/2)<W*0.5){label(p3.sx,p3.sy-34*p3.s,L("按 T 或点击对话","Press T or click to talk"),"#7fe7ff");
    if(d2<bestNpc){bestNpc=d2;nearNpc=n3;lastNpcHit={npc:n3,sx:p3.sx,sy:p3.sy,s:p3.s}}}
  }})});
 /* 可互动的动物（可跟随、可骑乘） */
 nearCreature=null;var bestC=1e9;
 (era.creatures||[]).forEach(function(cr,ci){
  if(cr===riding)return;
  var wx,wz2;
  if(cr._follow){
   if(cr.fx===undefined){cr.fx=cr.x;cr.fz=cr.z}
   var fg=Math.min(dt*1.4,0.5);
   cr.fx+=((P0.x-0.9)-cr.fx)*fg;cr.fz+=((P0.z-1.3)-cr.fz)*fg;
   wx=cr.fx;wz2=cr.fz;
  }else{wx=cr.x+Math.sin(tSec*0.3+ci*2.4)*1.1;wz2=cr.z+Math.cos(tSec*0.23+ci*1.7)*0.7}
  draws.push({z:wz2,fn:function(){
   var p3=project(wx,wz2);if(!p3)return;
   var c2=mix(era.fg,"#0B0B12",(1-dl)*0.8);
   ANIMALS[cr.a](ctx,p3.sx,p3.sy,p3.s,c2,tSec,dl);
   var d2=Math.hypot(wx-P0.x,wz2-P0.z);
   if(d2<6&&Math.abs(p3.sx-W/2)<W*0.5){
    label(p3.sx,p3.sy-22*p3.s,t2(cr.n)+(cr.ride&&!riding?L(" · 按 G 骑乘"," · Press G to ride"):L(" · 按 G 互动"," · Press G to interact")),"#7fe7ff");
    if(d2<bestC){bestC=d2;nearCreature={cr:cr,sx:p3.sx,sy:p3.sy}}}
  }})});
 /* 时光连动：埋下/挖出泥球 */
 nearDig=null;
 var DIGS={pre:{x:9,z:28,label:"时光土堆"},now:{x:-9,z:30,label:"翻新的土坑"}};
 var dg=DIGS[era.key];
 if(dg){var dgAct=era.key=="pre"?(!store.tcLink):(!store.tcLink);
  draws.push({z:dg.z,fn:function(){
   var p3=project(dg.x,dg.z);if(!p3)return;
   ctx.fillStyle=mix(era.gnd[1],"#3A2E1A",0.4);ctx.beginPath();ctx.ellipse(p3.sx,p3.sy,10*p3.s,3.4*p3.s,0,0,7);ctx.fill();
   if(era.key=="pre"){ctx.fillStyle=mix(era.fg,"#0B0B12",0.3);ctx.beginPath();ctx.ellipse(p3.sx,p3.sy-3*p3.s,5*p3.s,2.4*p3.s,0,0,7);ctx.fill()}
   var d2=Math.hypot(dg.x-P0.x,dg.z-P0.z);
   if(d2<5){var lbl=dgAct?(t2(dg.label)+L(" · 按 G "," · Press G ")+(era.key=="pre"?L("埋下时光泥球","to bury a clay ball of time"):L("挖挖看","to dig"))):(t2(dg.label)+L(" · "," · ")+(era.key=="pre"?L("泥球已经埋下了","the clay ball is buried"):L("坑里空空的","the pit is empty")));
    label(p3.sx,p3.sy-12*p3.s,lbl,"#FAC775");
    if(dgAct)nearDig=dg}
  }})}
 /* NPC 委托任务物品 */
 questItem=null;
 var qnpc=null;era.npcs.forEach(function(nn){if(nn.q)qnpc=nn});
 if(qnpc&&(store.qstate[era.key]||0)==1){
  var eIdx=ERAS.indexOf(era);
  var qi={x:(rnd(eIdx*3+1)*14-7),z:16+rnd(eIdx*5+2)*18,icon:qnpc.q.icon,name:qnpc.q.it,_quest:true,_npc:qnpc.n};
  questItem=qi;
  draws.push({z:qi.z,fn:function(){
   var p3=project(qi.x,qi.z);if(!p3)return;
   var d2=Math.hypot(qi.x-P0.x,qi.z-P0.z);
   var gl=0.3+0.2*Math.sin(tSec*3.5)+((d2<5)?0.35:0);
   ctx.save();ctx.globalAlpha=gl;ctx.fillStyle="#7fe7ff";ctx.beginPath();ctx.arc(p3.sx,p3.sy-6*p3.s,15*p3.s,0,7);ctx.fill();ctx.restore();
   ctx.save();ctx.translate(p3.sx,p3.sy-6*p3.s);ICONS[qi.icon](p3.s*1.1);ctx.restore();
   if(d2<5&&Math.abs(p3.sx-W/2)<W*0.4){label(p3.sx,p3.sy-20*p3.s,t2(qi.name)+L(" · 任务物品，按空格拾取"," · Quest item, Space to pick up"),"#7fe7ff");
    if(!nearItem){nearItem=qi;lastItemHit={it:qi,sx:p3.sx,sy:p3.sy-6*p3.s,s:p3.s}}}
  }})}
 /* 可进屋的房子 */
 nearHouse=null;var bestH=1e9;
 (era.houses||[]).forEach(function(h){
  draws.push({z:h.z,fn:function(){
   var p3=project(h.x,h.z);if(!p3)return;
   var c2=mix(era.fg,"#0B0B12",(1-dl)*0.8);
   P[h.prop](ctx,p3.sx,p3.sy,p3.s*1.5,c2,tSec,dl,h.sd||3);
   var pu=0.5+0.5*Math.sin(tSec*3);
   ctx.save();ctx.globalAlpha=0.3+0.4*pu;ctx.fillStyle="#FAC775";ctx.beginPath();ctx.arc(p3.sx,p3.sy-4*p3.s,3*p3.s,0,7);ctx.fill();ctx.restore();
   var d2=Math.hypot(h.x-P0.x,h.z-P0.z);
   if(d2<5&&Math.abs(p3.sx-W/2)<W*0.5){label(p3.sx,p3.sy-32*p3.s,t2(h.label)+L(" · 按 F 进屋"," · Press F to enter"),"#FAC775");
    if(d2<bestH){bestH=d2;nearHouse=h}}
  }})});
 draws.sort(function(a,b){return b.z-a.z});
 draws.forEach(function(d2){d2.fn()});
 /* 天气层 */
 if(weather=="rain"){
  ctx.save();ctx.strokeStyle="rgba(170,200,240,.4)";ctx.lineWidth=1;
  drops.forEach(function(dr){dr.y+=dr.v*dt*1.6;if(dr.y>1.05){dr.y=-0.05;dr.x=Math.random()}
   var dx=dr.x*W,dy=dr.y*H;
   ctx.beginPath();ctx.moveTo(dx,dy);ctx.lineTo(dx-3,dy+dr.l*H);ctx.stroke()});
  ctx.restore();
  ctx.fillStyle="rgba(15,25,45,0.15)";ctx.fillRect(0,0,W,H);
 }else if(weather=="snow"){
  ctx.save();ctx.fillStyle="rgba(240,245,255,.8)";
  flakes.forEach(function(fl){fl.y+=fl.v*dt;if(fl.y>1.05){fl.y=-0.05;fl.x=Math.random()}
   var fx=(fl.x+Math.sin(tSec+fl.ph)*0.01)*W,fy=fl.y*H;
   ctx.beginPath();ctx.arc(fx,fy,fl.s,0,7);ctx.fill()});
  ctx.restore();
  ctx.fillStyle="rgba(190,205,225,0.1)";ctx.fillRect(0,0,W,H);
 }else if(weather=="sand"){
  ctx.fillStyle="rgba(200,150,60,0.15)";ctx.fillRect(0,0,W,H);
  ctx.save();ctx.strokeStyle="rgba(230,190,110,.3)";ctx.lineWidth=1.5;
  for(var si=0;si<6;si++){var sy2=(0.55+((tSec*0.12+si*0.17)%0.45))*H;
   ctx.beginPath();ctx.moveTo(0,sy2);ctx.lineTo(W*0.3,sy2-4);ctx.stroke()}
  ctx.restore();
 }
}
function drawProp(p2,dl){
 var t=p2[0],x=p2[1],z=p2[2],seed=p2[3]||1;
 var p3=project(x,z);if(!p3)return;
 var c=mix(era.fg,"#0B0B12",(1-dl)*0.8);
 var fn=P[t];if(!fn)return;
 var fog=clamp(1.35-z/48,0.42,1);
 ctx.save();ctx.globalAlpha=fog;
 fn(ctx,p3.sx,p3.sy,p3.s,c,tSec,dl,seed);
 ctx.restore();
}
/* ================= 语言切换 ================= */
function applyLang(){
 HINT_TEXT=L("W A S D 移动 · 鼠标转视角（可360°转身+抬头低头）· 空格 拾取 · T 对话 · G 互动 / 骑乘 · F 进屋 · P 暂停 · R 倒流 · H 拍照 · M 音效","W A S D move · mouse to look (full 360° turn + look up/down) · Space pick up · T talk · G interact / ride · F enter house · P pause · R rewind · H photo · M sound");
 $("corHint").textContent=L("滚动滚轮 / 上下拖动 前进 · 点击画框走进那个时代 · 尽头有门","Scroll wheel / drag to walk the corridor · Click a painting to enter its era · A door waits at the end");
 $("corToast").textContent=L("这一幕还在建造中","This scene is still being built");
 $("backCor").textContent=L("回到走廊","Back to Corridor");
 $("muteBtn").textContent=muted?L("♪ 已静音","♪ Muted"):L("♪ 音效","♪ Sound");
 $("langBtn").textContent=lang=="zh"?"EN":"中文";
 $("langBtn2").textContent=lang=="zh"?"EN":"中文";
 $("scHint").textContent=HINT_TEXT;
 $("pocketPanel").querySelector("h4").textContent=L("口袋 · 从各时代带回的物件","Pocket · Kept from every era");
 renderPocket();
 $("dlgX").textContent=L("关闭（空格）","Close (Space)");
 $("dlgIn").placeholder=L("用中文或 English 回答…（空格关闭对话）","Reply in any language… (Space closes)");
 $("dlgSend").textContent=L("发送","Send");
 document.querySelector("#photoF .pmk").textContent=L("TIME CORRIDOR · 拍照模式（按 H 退出）","TIME CORRIDOR · Photo Mode (H to exit)");
 $("endBox").querySelector("h2").textContent=L("你已抵达时间之外","You Have Arrived Beyond Time");
 $("endClose").textContent=L("继续游荡","Wander On");
 corFrames.forEach(function(f){var cap=f.el.querySelector(".cap");if(cap){cap.querySelector("b").textContent=t2(f.e.name);cap.querySelector("span").textContent=t2(f.e.year)}});
 var dl2=document.querySelector(".doorLbl");if(dl2)dl2.textContent=L("时间尽头","Beyond Time's End");
 if(sceneOpen&&era){
  $("scEra").textContent=t2(era.name)+(inside?L(" · 屋内"," · Indoors"):"");
  $("scYear").textContent=t2(era.year);
  if(dlgOpen&&dlgNpc)$("dlgName").textContent=t2(dlgNpc.n)+" · "+t2(era.name);
 }
 updPk();
}
function toggleLang(){lang=lang=="zh"?"en":"zh";ls("tcLang",lang);applyLang()}
$("langBtn").addEventListener("click",toggleLang);
$("langBtn2").addEventListener("click",toggleLang);
applyLang();
requestAnimationFrame(loop);
</script>
