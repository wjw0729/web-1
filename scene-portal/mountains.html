<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mountain Lake - Scene Portal</title>
    <meta name="description" content="Golden reflections on a mountain lake, in 360 degrees.">
    <meta name="theme-color" content="#050918">
    <meta property="og:title" content="Mountain Lake - Scene Portal">
    <meta property="og:description" content="Golden reflections on a mountain lake, in 360 degrees.">
    <meta property="og:image" content="https://wjw0729.github.io/web-1/scene-portal/images/og-image.jpg">
    <meta property="og:url" content="https://wjw0729.github.io/web-1/scene-portal/mountains.html">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="js/three.min.js"></script>
</head>
<body>
    <h1 class="sr-only">Mountain Lake</h1>
    <style>
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.mini-nav{position:fixed;top:18px;right:18px;z-index:120;font-family:Inter,Arial,sans-serif}
.mini-nav.mini-lower{top:62px}
#langBtn{position:absolute;top:16px;right:112px;z-index:6}
.mini-toggle{width:44px;height:44px;border-radius:50%;border:1px solid rgba(127,231,255,.55);
 background:rgba(5,10,25,.72);color:#8fe3ff;font-size:19px;cursor:pointer;backdrop-filter:blur(10px)}
.mini-toggle:hover{border-color:#8fe3ff}
.mini-links{display:none;position:absolute;top:52px;right:0;min-width:168px;padding:10px;
 background:rgba(5,10,25,.92);border:1px solid rgba(127,231,255,.35);border-radius:12px;
 backdrop-filter:blur(12px);box-shadow:0 12px 30px rgba(0,0,0,.5)}
.mini-nav.open .mini-links{display:flex;flex-direction:column;gap:2px}
.mini-links a{display:block;padding:9px 12px;border-radius:8px;color:#dbeafe;text-decoration:none;font-size:14px}
.mini-links a:hover,.mini-links a[aria-current="page"]{background:rgba(127,231,255,.14);color:#8fe3ff}
@media(max-width:768px){.mini-nav{top:12px;right:12px}.mini-toggle{width:42px;height:42px}}
</style>
<nav class="mini-nav" aria-label="Main navigation">
  <button class="mini-toggle" aria-expanded="false" aria-label="Open site navigation">☰</button>
  <div class="mini-links">
    <a href="index.html">Home</a><a href="gallery.html">Gallery</a>
    <a href="hourglass-intro.html">Hourglass</a><a href="museum.html">Museum</a>
    <a href="about.html">About</a>
  </div>
</nav>
<script>
(function(){var n=document.querySelector('.mini-nav'),b=n&&n.querySelector('.mini-toggle');
 if(!b)return;b.addEventListener('click',function(){var o=n.classList.toggle('open');b.setAttribute('aria-expanded',o?'true':'false')});
 var here=location.pathname.split('/').pop()||'index.html';
 n.querySelectorAll('a').forEach(function(a){if(a.getAttribute('href')===here)a.setAttribute('aria-current','page')});
})();
</script>
    <div id="flash-overlay"></div>
    <div id="scene-container"></div>

    <a href="gallery.html" class="back-btn">← Back to Gallery</a>
    
    <div class="crosshair"></div>
    <div id="ui-hints"><p>🖱️ Click to look | ⌨️ W A S D to move</p></div>
    
    <section class="control-panel" aria-label="Scene controls">
        <div class="panel-title">CONTROL</div>
        <div class="panel-icons">
            <button class="icon-btn">🚶</button>
            <button class="icon-btn">📷</button>
        </div>
        <div class="panel-title">WEATHER</div>
        <div class="panel-icons">
            <button class="icon-btn">🌧️</button>
            <button class="icon-btn">❄️</button>
            <button class="icon-btn">☀️</button>
        </div>
        <div class="panel-title">TIME</div>
        <input type="range" min="0" max="100" value="50" class="time-slider">
    </section>

    <button id="photo-btn" class="camera-btn">📷 Make a Postcard</button>

    <div id="memory-modal" class="hidden">
        <div class="modal-content">
            <h2>Write a Postcard</h2>
            <p>Keep this moment — download it as a postcard.</p>
            <textarea id="memory-text" placeholder="One line about this moment..."></textarea>
            <div class="modal-buttons">
                <button id="cancel-memory">Cancel</button>
                <button id="save-memory">Download Postcard</button>
            </div>
        </div>
    </div>

    <script>
        const container = document.getElementById('scene-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 0); 
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        // 🔥 加载群山湖泊全景图
        const texture = new THREE.TextureLoader().load('images/mountains-360.jpg'); 
        const geometry = new THREE.SphereGeometry(500, 60, 40);
        geometry.scale(-1, 1, 1); 
        const material = new THREE.MeshBasicMaterial({ map: texture });
        const sphere = new THREE.Mesh(geometry, material);
        scene.add(sphere);

        let isLocked = false, targetRotationX = 0, targetRotationY = 0;
        container.addEventListener('click', () => { container.requestPointerLock(); });
        document.addEventListener('pointerlockchange', () => { isLocked = document.pointerLockElement === container; });
        document.addEventListener('mousemove', (e) => {
            if (isLocked) {
                targetRotationY -= e.movementX * 0.002;
                targetRotationX -= e.movementY * 0.002;
                targetRotationX = Math.max(-Math.PI/2, Math.min(Math.PI/2, targetRotationX));
            }
        });

        const keys = { w: false, a: false, s: false, d: false };
        const footstepAudio = new Audio('others/footstep.mp3');
        footstepAudio.loop = true;
        
        document.addEventListener('keydown', (e) => { 
            if (e.key.toLowerCase() in keys) {
                keys[e.key.toLowerCase()] = true; 
                if (window.isSoundOn !== false && footstepAudio.paused) {
                    footstepAudio.play().catch(() => {});
                }
            }
        });
        document.addEventListener('keyup', (e) => { 
            if (e.key.toLowerCase() in keys) {
                keys[e.key.toLowerCase()] = false; 
                if (!keys.w && !keys.a && !keys.s && !keys.d) {
                    footstepAudio.pause();
                    footstepAudio.currentTime = 0;
                }
            }
        });

        let bobTime = 0;

        function animate() {
            requestAnimationFrame(animate);
            sphere.rotation.y += (targetRotationY - sphere.rotation.y) * 0.1;
            sphere.rotation.x += (targetRotationX - sphere.rotation.x) * 0.1;

            let isMoving = false;
            if (keys.w && camera.position.z > -100) { camera.position.z -= 2; isMoving = true; }
            if (keys.s && camera.position.z < 100) { camera.position.z += 2; isMoving = true; }
            if (keys.a && camera.position.x > -100) { camera.position.x -= 2; isMoving = true; }
            if (keys.d && camera.position.x < 100) { camera.position.x += 2; isMoving = true; }

            if (isMoving) {
                bobTime += 0.15; 
                camera.position.y = Math.sin(bobTime) * 2; 
            } else {
                camera.position.y += (0 - camera.position.y) * 0.1;
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const flashOverlay = document.getElementById('flash-overlay');
        const photoBtn = document.getElementById('photo-btn');
        const modal = document.getElementById('memory-modal');
        const cancelBtn = document.getElementById('cancel-memory');
        const saveBtn = document.getElementById('save-memory');
        const textInput = document.getElementById('memory-text');

        photoBtn.addEventListener('click', () => {
            flashOverlay.classList.add('flash');
            setTimeout(() => { flashOverlay.classList.remove('flash'); }, 300);
            document.exitPointerLock();
            footstepAudio.pause();
            setTimeout(() => { modal.classList.remove('hidden'); }, 200);
        });

        cancelBtn.addEventListener('click', () => { modal.classList.add('hidden'); });
        
                                                saveBtn.addEventListener('click', () => {
            const text = textInput.value.trim();
            if (!text) return alert('Please write one line for your postcard!');
            // 现场画一张明信片并下载：不写入浏览器存储，也不发送到任何服务器
            const c = document.createElement('canvas');
            c.width = 1200; c.height = 750;
            const x = c.getContext('2d');
            const g = x.createLinearGradient(0, 0, 1200, 750);
            g.addColorStop(0, '#050918'); g.addColorStop(1, '#14264c');
            x.fillStyle = g; x.fillRect(0, 0, 1200, 750);
            x.strokeStyle = 'rgba(250,199,117,.65)'; x.lineWidth = 3;
            x.strokeRect(52, 52, 1096, 646);
            x.fillStyle = '#FAC775'; x.font = '600 26px Inter, Arial, sans-serif';
            x.fillText('SCENE PORTAL  /  A POSTCARD FROM', 92, 130);
            x.fillStyle = '#FFFFFF'; x.font = '800 62px Inter, Arial, sans-serif';
            x.fillText("Mountain Lake", 92, 208);
            x.fillStyle = '#8FE3FF'; x.font = '400 34px Inter, Arial, sans-serif';
            const words = text.split(/\s+/); let line = '', y = 320;
            words.forEach(function (w) {
                const test = line ? line + ' ' + w : w;
                if (x.measureText(test).width > 1000 && line) {
                    x.fillText(line, 92, y); y += 52; line = w;
                } else line = test;
            });
            if (line) x.fillText(line, 92, y);
            x.fillStyle = 'rgba(255,255,255,.6)'; x.font = '400 24px Inter, Arial, sans-serif';
            x.fillText(new Date().toLocaleDateString() + '   ·   made on this visit, kept by you', 92, 640);
            const a = document.createElement('a');
            a.download = 'scene-portal-postcard.png';
            a.href = c.toDataURL('image/png');
            a.click();
            textInput.value = '';
            modal.classList.add('hidden');
        });
    </script>
<script>
/* 让控制面板里的每个按钮都有真实反馈，并让手机可以环顾与行走 */
(function () {
    const cv = document.getElementById('scene-container');
    const layer = document.createElement('div');
    layer.id = 'wx-layer';
    cv.appendChild(layer);

    const buttons = Array.prototype.slice.call(document.querySelectorAll('.control-panel .icon-btn'));
    const toast = document.getElementById('ui-hints');
    // 触屏设备给出对应操作说明，不再提示键盘 WASD
    if (((window.matchMedia && window.matchMedia('(pointer: coarse)').matches) || window.innerWidth <= 820) && toast) {
        const p0 = toast.querySelector('p');
        if (p0) p0.textContent = '👆 Drag to look around  ·  Use ↑ ↓ to move';
    }
    function hint(t) {
        if (!toast) return;
        const p = toast.querySelector('p');
        if (!p) return;
        const old = p.textContent;
        p.textContent = t;
        clearTimeout(hint._t);
        hint._t = setTimeout(function () { p.textContent = old; }, 2200);
    }
    function weather(cls, label) {
        layer.className = cls === 'wx-clear' ? '' : cls;
        hint(label);
    }
    // [0] 行走模式  [1] 拍照  [2] 雨  [3] 雪  [4] 晴
    if (buttons[0]) buttons[0].addEventListener('click', function () {
        const on = document.body.classList.toggle('walk-mode');
        hint(on ? '🚶 Walk mode on — drag to look, use the arrows to move' : '🚶 Walk mode off');
    });
    if (buttons[1]) buttons[1].addEventListener('click', function () {
        const b = document.getElementById('photo-btn'); if (b) b.click();
    });
    if (buttons[2]) buttons[2].addEventListener('click', function () { weather('wx-rain', '🌧️ Rain over the scene'); });
    if (buttons[3]) buttons[3].addEventListener('click', function () { weather('wx-snow', '❄️ Snow falling'); });
    if (buttons[4]) buttons[4].addEventListener('click', function () { weather('wx-clear', '☀️ Clear skies'); });

    // 时间滑块 → 昼夜明暗（直接改球体材质，不使用存储）
    const slider = document.querySelector('.time-slider');
    if (slider) slider.addEventListener('input', function () {
        const v = Number(this.value) / 100;
        if (typeof material !== 'undefined') material.color.setScalar(0.34 + v * 0.66);
        if (typeof scene !== 'undefined' && scene.fog) scene.fog.color.setScalar(0.05 + v * 0.12);
        hint(v < 0.3 ? '🌙 Night' : v > 0.7 ? '🌇 Late afternoon' : '☀️ Midday');
    });

    // 触屏：单指拖拽环顾（桌面仍用指针锁定 + WASD）
    let tx = 0, ty = 0;
    cv.addEventListener('touchstart', function (e) {
        if (e.touches.length === 1) { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }
    }, { passive: true });
    cv.addEventListener('touchmove', function (e) {
        if (e.touches.length !== 1) return;
        const nx = e.touches[0].clientX, ny = e.touches[0].clientY;
        targetRotationY -= (nx - tx) * 0.006;
        targetRotationX -= (ny - ty) * 0.006;
        targetRotationX = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, targetRotationX));
        tx = nx; ty = ny;
    }, { passive: true });

    // 触屏移动按钮
    const pad = document.createElement('div');
    pad.className = 'move-pad';
    pad.setAttribute('aria-label', 'Move forward and back');
    pad.innerHTML = '<button type="button" data-dir="1" aria-label="Move forward">↑</button>' +
                    '<button type="button" data-dir="-1" aria-label="Move back">↓</button>';
    document.body.appendChild(pad);
    let dir = 0;
    pad.querySelectorAll('button').forEach(function (b) {
        const d = Number(b.getAttribute('data-dir'));
        const on = function (e) { e.preventDefault(); dir = d; b.classList.add('held'); };
        const off = function () { dir = 0; b.classList.remove('held'); };
        b.addEventListener('pointerdown', on);
        b.addEventListener('pointerup', off);
        b.addEventListener('pointerleave', off);
        b.addEventListener('pointercancel', off);
    });
    (function moveLoop() {
        if (dir && typeof camera !== 'undefined') {
            camera.position.z = Math.max(-100, Math.min(100, camera.position.z + dir * 1.6));
        }
        requestAnimationFrame(moveLoop);
    })();
})();
</script>
</body>
</html>
